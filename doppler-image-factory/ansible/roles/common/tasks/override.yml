---
- name: Create /etc/systemd/system/apt-daily.timer.d folder
  file:
    path: /etc/systemd/system/apt-daily.timer.d
    state: directory
    owner: root
    group: root
    mode: 0755

- name: Override apt autoupdate
  copy: src=override.conf
    dest=/etc/systemd/system/apt-daily.timer.d/override.conf
    owner=root
    group=root
    mode='644'

- name: Disable service
  command: systemctl disable apt-daily.service

- name: Disable timer
  command: systemctl disable apt-daily.timer

- name: Disable apt daily upgrade service
  command: systemctl disable apt-daily-upgrade.service

- name: Disable apt daily upgrade timer
  command: systemctl disable apt-daily-upgrade.timer

- name: Stop unattended upgrades service if running
  systemd:
    name: unattended-upgrades
    state: stopped
    enabled: false
  failed_when: false

- name: Stop apt daily service if running
  systemd:
    name: apt-daily.service
    state: stopped
  failed_when: false

- name: Stop apt daily upgrade service if running
  systemd:
    name: apt-daily-upgrade.service
    state: stopped
  failed_when: false
